
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">
<title>AYRA - Personal AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050507;
  color: white;
  font-family: Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 18px;
}

header h1 {
  color: #ff3030;
  letter-spacing: 7px;
  margin: 0;
  text-shadow: 0 0 18px red;
}

header p {
  color: #777;
  font-size: 11px;
  letter-spacing: 3px;
}

.stage {
  height: 39vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.core {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffcccc, #ff2929 35%, #700000 75%);
  box-shadow: 0 0 25px #ff1717, 0 0 65px #a00000;
  animation: pulse 2s infinite alternate;
  z-index: 2;
}

.orbit {
  position: absolute;
  width: 210px;
  height: 80px;
  border: 1px solid #ff343477;
  border-radius: 50%;
  animation: spin 4s linear infinite;
}

.orbit.two {
  width: 230px;
  height: 100px;
  animation: spin2 5s linear infinite;
}

.orbit.three {
  width: 230px;
  height: 100px;
  animation: spin3 6s linear infinite;
}

.atom {
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: red;
  box-shadow: 0 0 15px red;
  top: 50%;
  left: 0;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes spin2 {
  from { transform: rotate(60deg); }
  to { transform: rotate(420deg); }
}

@keyframes spin3 {
  from { transform: rotate(-60deg); }
  to { transform: rotate(300deg); }
}

@keyframes pulse {
  from { transform: scale(.95); }
  to { transform: scale(1.12); }
}

body.thinking .core {
  animation: pulse .45s infinite alternate;
}

body.listening .core {
  box-shadow: 0 0 40px red, 0 0 100px red;
}

#chat {
  height: 30vh;
  overflow-y: auto;
  padding: 10px 16px;
}

.msg {
  padding: 12px 15px;
  border-radius: 15px;
  margin: 9px 0;
  max-width: 88%;
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 14px;
}

.user {
  background: #551515;
  margin-left: auto;
}

.bot {
  background: #19191e;
  border: 1px solid #292929;
}

#status {
  text-align: center;
  color: #ff4444;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 5px;
  min-height: 25px;
}

footer {
  position: absolute;
  bottom: 0;
  width: 100%;
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #0d0d11;
}

input {
  flex: 1;
  min-width: 0;
  background: #19191e;
  border: 1px solid #444;
  color: white;
  padding: 14px;
  border-radius: 25px;
  font-size: 15px;
  outline: none;
}

button {
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  background: #d71919;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}
</style>
</head>

<body>

<header>
  <h1>AYRA</h1>
  <p>SMART • LOYAL • INTELLIGENT</p>
</header>

<div class="stage">
  <div class="orbit"><div class="atom"></div></div>
  <div class="orbit two"><div class="atom"></div></div>
  <div class="orbit three"><div class="atom"></div></div>
  <div class="core"></div>
</div>

<div id="chat">
  <div class="msg bot">
    Hello! I am AYRA ❤️
    Your personal AI assistant.
  </div>
</div>

<div id="status">SYSTEM READY</div>

<footer>
  <button id="micBtn" type="button">🎙</button>

  <input
    id="message"
    type="text"
    placeholder="Talk to AYRA..."
    autocomplete="off"
  >

  <button id="sendBtn" type="button">➤</button>
</footer>

<script>
const API_URL =
"https://ayra-ai.ganta-santhosh-218.workers.dev/";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

let recognition = null;
let isListening = false;

function setStatus(text, mode = "") {
  statusText.textContent = text;
  document.body.className = mode;
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message || sendBtn.disabled) return;

  input.value = "";
  addMessage(message, "user");
  setStatus("AYRA IS THINKING...", "thinking");
  sendBtn.disabled = true;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "API request failed");
    }

    const reply = data.reply || "No reply received.";
    addMessage(reply, "bot");
    speak(reply);
    setStatus("SYSTEM READY");

  } catch (error) {
    addMessage("Connection error: " + error.message, "bot");
    setStatus("CONNECTION ERROR");
  } finally {
    sendBtn.disabled = false;
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    setStatus("VOICE OUTPUT NOT SUPPORTED");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 1;
  speech.pitch = 1;

  speech.onend = () => {
    if (!isListening) setStatus("SYSTEM READY");
  };

  window.speechSynthesis.speak(speech);
}

function voiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus("VOICE NOT SUPPORTED IN THIS BROWSER");
    return;
  }

  if (isListening && recognition) {
    recognition.stop();
    return;
  }

  try {
    recognition = new SpeechRecognition();

    recognition.lang = "te-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      micBtn.textContent = "⏹";
      setStatus("LISTENING... SPEAK NOW", "listening");
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;

      if (transcript.trim()) {
        input.value = transcript;
        setStatus("VOICE RECEIVED");
        recognition.stop();
        sendMessage();
      }
    };

    recognition.onerror = (event) => {
      isListening = false;
      micBtn.textContent = "🎙";
      setStatus("MIC ERROR: " + event.error);
    };

    recognition.onnomatch = () => {
      setStatus("VOICE NOT RECOGNIZED. TRY AGAIN");
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.textContent = "🎙";

      if (statusText.textContent === "LISTENING... SPEAK NOW") {
        setStatus("LISTENING STOPPED. TAP MIC TO RETRY");
      }

      document.body.classList.remove("listening");
    };

    recognition.start();

  } catch (error) {
    isListening = false;
    micBtn.textContent = "🎙";
    setStatus("MIC START ERROR: " + error.message);
  }
}

micBtn.addEventListener("click", voiceInput);
sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
