
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050507">
<title>AYRA AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050507;color:white;
 font-family:Arial,sans-serif;
 height:100dvh;overflow:hidden;
}
header{text-align:center;padding:20px}
header h2{color:#ff3434;letter-spacing:5px;margin:0}
header p{color:#777;font-size:12px}
.stage{
 height:48vh;display:flex;
 align-items:center;justify-content:center;
 position:relative;
}
.core{
 width:90px;height:90px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#ffaaaa,#ff2525 35%,#700000 75%);
 box-shadow:0 0 25px #ff1717,0 0 70px #9d0000;
 animation:pulse 2s infinite alternate;
 z-index:2;
}
.orbit{
 position:absolute;border:1px solid #ff343477;
 border-radius:50%;
 width:190px;height:75px;
 animation:spin 4s linear infinite;
}
.orbit.two{width:220px;height:100px;transform:rotate(60deg);animation:spin2 5s linear infinite}
.orbit.three{width:220px;height:100px;transform:rotate(-60deg);animation:spin3 6s linear infinite}
.atom{
 position:absolute;width:12px;height:12px;
 border-radius:50%;background:#ff3434;
 box-shadow:0 0 15px #ff2020;
 top:50%;left:0;transform:translate(-50%,-50%);
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spin2{from{transform:rotate(60deg)}to{transform:rotate(420deg)}}
@keyframes spin3{from{transform:rotate(-60deg)}to{transform:rotate(300deg)}}
@keyframes pulse{from{transform:scale(.95)}to{transform:scale(1.08)}}
#chat{
 height:25vh;overflow-y:auto;padding:10px 18px;
}
.msg{padding:10px 14px;border-radius:14px;
 margin:8px 0;max-width:85%;white-space:pre-wrap;line-height:1.4}
.user{background:#551515;margin-left:auto}
.bot{background:#19191e}
#status{text-align:center;color:#888;font-size:12px}
footer{
 position:absolute;bottom:0;width:100%;
 display:flex;gap:8px;padding:12px;
 background:#0d0d11;
}
input{
 flex:1;min-width:0;background:#19191e;
 border:1px solid #444;color:white;
 padding:14px;border-radius:25px;font-size:15px;
}
button{
 border:0;border-radius:50%;width:48px;height:48px;
 background:#d71919;color:white;font-size:20px;
}
</style>
</head>
<body>
<header>
<h2>AYRA</h2>
<p>SMART • LOYAL • INTELLIGENT</p>
</header>

<div class="stage">
 <div class="orbit"><div class="atom"></div></div>
 <div class="orbit two"><div class="atom"></div></div>
 <div class="orbit three"><div class="atom"></div></div>
 <div class="core"></div>
</div>

<div id="chat">
 <div class="msg bot">Hello! I am AYRA ❤️</div>
</div>
<div id="status">SYSTEM READY</div>

<footer>
 <button onclick="voiceInput()">🎙</button>
 <input id="message" placeholder="Talk to AYRA...">
 <button onclick="sendMessage()">➤</button>
</footer>

<script>
const API_URL="https://ayra-ai.mrpro2182010.workers.dev/";
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const statusText=document.getElementById("status");

function addMessage(text,type){
 const d=document.createElement("div");
 d.className="msg "+type;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;
 input.value="";
 addMessage(message,"user");
 statusText.textContent="AYRA IS THINKING...";

 try{
  const r=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"Request failed");
  const reply=data.reply||"No reply received";
  addMessage(reply,"bot");
  if("speechSynthesis" in window){
   speechSynthesis.cancel();
   speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
  }
  statusText.textContent="SYSTEM READY";
 }catch(e){
  addMessage("Connection error: "+e.message,"bot");
  statusText.textContent="CONNECTION ERROR";
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function voiceInput(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){statusText.textContent="Voice not supported";return;}
 const rec=new SR();
 rec.lang="te-IN";
 rec.onstart=()=>statusText.textContent="LISTENING...";
 rec.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 rec.onerror=()=>statusText.textContent="MICROPHONE ERROR";
 rec.start();
}
</script>
</body>
</html>
